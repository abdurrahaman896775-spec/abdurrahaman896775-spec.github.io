<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Bangla and English news, online earning guides, cricket, football and AI technology.">
<title>AI Path Bangla | বাংলা ও English</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#20283a}
header{
background:
radial-gradient(circle at 85% 20%,rgba(45,212,191,.45),transparent 28%),
radial-gradient(circle at 15% 100%,rgba(251,191,36,.25),transparent 30%),
linear-gradient(120deg,#102a56,#087d61,#5b21b6);
color:white;
padding:32px 20px;
text-align:center;
position:relative;
overflow:hidden;
box-shadow:0 5px 20px rgba(16,42,86,.2)
}
header h1{
font-size:clamp(30px,6vw,48px);
font-weight:800;
letter-spacing:.5px;
text-shadow:0 3px 12px rgba(0,0,0,.25)
}
header p{font-size:16px;line-height:1.7}
header .lang{justify-content:center;flex-wrap:wrap}
header .lang button{box-shadow:0 3px 10px rgba(0,0,0,.12)}
@media(max-width:480px){
header{padding:26px 12px}
header p{font-size:14px}
}
main{max-width:850px;margin:auto;padding:16px}
h1{margin:0 0 8px}
button,.category{border:0;border-radius:9px;padding:10px 13px;cursor:pointer}
button{background:#fff;color:#153c32;font-weight:bold}
.lang{display:flex;gap:8px;margin-top:15px}
.lang button.active{background:#d1fae5}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.category{background:#e1e8f2;color:#20283a}
.category.active{background:#153c32;color:white}
.card{background:white;padding:18px;margin:14px 0;border-radius:14px}
a{color:#087d61;text-decoration:none}
a:hover{text-decoration:underline}
small{color:#64748b}
</style>
    <meta name="google-site-verification" content="w_PcWWojZyEJxiUi-DEqIFqdwCIh7yRqwHapHkKNooU" />
    <meta name="google-adsense-account" content="ca-pub-5178515558357371">
</head>
<body>
<header>
<h1>AI Path Bangla</h1>
<p id="tagline">News, online earning, sports and AI technology.</p>
<div class="lang">
<button id="en" onclick="setLang('en')">English</button>
<button id="bn" onclick="setLang('bn')">বাংলা</button>
</div>
</header>
<main>
<div class="card">
<h2 id="welcome"></h2>
<p id="intro"></p>
</div>
<nav id="categories"></nav>
<div class="card">
<h2 id="updates-heading"></h2>
<div id="updates-list">Loading updates...</div>
</div>
<div class="card">
<h2 id="latest"></h2>
<div id="article-list">Loading articles...</div>
</div>
<footer><small>© AI Path Bangla | News • Earning • Sports • AI</small></footer>
</main>
<script>
let lang=localStorage.getItem('aipath-lang')||'bn';
let category='all';
const words={
en:{
tag:'News, online earning, sports and AI technology.',
welcome:'Welcome to AI Path Bangla',
intro:'Explore news, practical ways to earn online, cricket and football updates, AI tools and technology guides.',
latest:'Latest Articles',updates:'Latest News & Sports',
loading:'Loading articles...',empty:'No articles in this section yet.',
cats:[['all','All'],['news','News'],['earning','Online Earning'],['cricket','Cricket'],['football','Football'],['ai','AI & Technology'],['mobile','Mobile Tips']]
},
bn:{
tag:'বাংলা ও ইংরেজিতে খবর, অনলাইনে আয়, খেলাধুলা ও AI প্রযুক্তি।',
welcome:'AI Path Bangla-তে স্বাগতম',
intro:'বাংলা খবর, অনলাইনে আয়ের উপায়, ক্রিকেট-ফুটবল আপডেট, AI টুল এবং প্রযুক্তির গাইড পড়ুন।',
latest:'সাম্প্রতিক আর্টিকেল',updates:'সাম্প্রতিক খবর ও খেলা',
loading:'আর্টিকেল লোড হচ্ছে...',empty:'এই বিভাগে এখনও কোনো আর্টিকেল নেই।',
cats:[['all','সব বিষয়'],['news','নিউজ'],['earning','অনলাইনে আয়'],['cricket','ক্রিকেট'],['football','ফুটবল'],['ai','AI ও প্রযুক্তি'],['mobile','মোবাইল টিপস']]
}
};
function setLang(value){
lang=value;
localStorage.setItem('aipath-lang',value);
render();
}
function render(){
const w=words[lang];
document.documentElement.lang=lang;
document.getElementById('en').classList.toggle('active',lang==='en');
document.getElementById('bn').classList.toggle('active',lang==='bn');
document.getElementById('tagline').textContent=w.tag;
document.getElementById('welcome').textContent=w.welcome;
document.getElementById('intro').textContent=w.intro;
document.getElementById('latest').textContent=w.latest;
const nav=document.getElementById('categories');
nav.replaceChildren();
w.cats.forEach(([id,label])=>{
const b=document.createElement('button');
b.className='category'+(category===id?' active':'');
b.textContent=label;
b.onclick=()=>{category=id;render();};
nav.appendChild(b);
});
loadArticles(w);
loadUpdates(w);
}

function loadUpdates(w){
const box=document.getElementById('updates-list');
document.getElementById('updates-heading').textContent=w.updates;
box.textContent=w.loading;
fetch('./updates.json?ts='+Date.now()).then(r=>{
if(!r.ok) throw new Error('Updates unavailable');
return r.json();
}).then(data=>{
box.replaceChildren();
const labels=lang==='bn'
?{news:'খবর',cricket:'ক্রিকেট',football:'ফুটবল'}
:{news:'News',cricket:'Cricket',football:'Football'};
const items=(data.items||[]).filter(item=>
(item.lang||'bn')===lang &&
['news','cricket','football'].includes(item.category)
);
if(!items.length){box.textContent=w.empty;return;}
for(const cat of ['news','cricket','football']){
const group=items.filter(item=>item.category===cat);
if(!group.length) continue;
const heading=document.createElement('h3');
heading.textContent=labels[cat];
box.appendChild(heading);
group.forEach(item=>{
const p=document.createElement('p');
const a=document.createElement('a');
a.href=item.url;
a.target='_blank';
a.rel='noopener noreferrer';
a.textContent=item.title;
p.appendChild(a);
const small=document.createElement('small');
small.textContent=' — '+(item.source||'Google News')+
(item.published?' · '+item.published:'');
p.appendChild(document.createElement('br'));
p.appendChild(small);
box.appendChild(p);
});
}
const note=document.createElement('small');
note.textContent=lang==='bn'
?'সূত্র: Google News RSS। এটি লাইভ স্কোর নয়; মূল খবরের লিংকে গিয়ে বিস্তারিত দেখুন।'
:'Source: Google News RSS. These are not live scores; open the source link for details.';
box.appendChild(note);
}).catch(()=>{
box.textContent=lang==='bn'
?'আপডেট লোড হয়নি। পরে আবার চেষ্টা করুন।'
:'Updates could not load. Please try again later.';
});
}

function loadArticles(w){
const list=document.getElementById('article-list');
list.textContent=w.loading;
fetch('./articles.json?ts='+Date.now()).then(r=>{
if(!r.ok) throw new Error('Articles unavailable');
return r.json();
}).then(items=>{
list.replaceChildren();
items=items.filter(item=>{
const itemLang=item.lang||'bn';
const itemCat=item.category||'all';
return itemLang===lang&&(category==='all'||itemCat===category||itemCat==='all');
});
items.sort((a,b)=>(b.file||'').localeCompare(a.file||''));
if(!items.length){list.textContent=w.empty;return;}
items.forEach(item=>{
const p=document.createElement('p');
const a=document.createElement('a');
a.href='./articles/'+encodeURIComponent(item.file);
a.textContent=item.title;
p.appendChild(a);
list.appendChild(p);
});
}).catch(()=>{
list.textContent='Could not load articles / আর্টিকেল লোড করা যায়নি।';
});
}
render();
</script>

</html>
